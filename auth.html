<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluentWave | Student Sign In & Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Sign-In Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-dark: #0f172a;
      --text-muted: #475569;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auth-container {
      max-width: 480px;
      width: 100%;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 36px 32px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      position: relative;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    /* Google Button Wrapper */
    .social-auth {
      margin-bottom: 24px;
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 11px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
      color: var(--text-dark);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-google:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider:not(:empty)::before { margin-right: 12px; }
    .divider:not(:empty)::after { margin-left: 12px; }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-submit:hover { background: var(--primary-hover); }

    .help-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .error-msg {
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <a href="fluentwave_homepage.html" class="logo">
      <i class="fa-solid fa-graduation-cap"></i> FluentWave
    </a>
    <div>
      <a href="admin_portal.html" style="font-size: 13px; color: var(--text-muted); text-decoration: none;">
        <i class="fa-solid fa-lock"></i> Admissions Staff Portal
      </a>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="tab-btn active" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
      <button class="tab-btn" id="tab-login" onclick="switchTab('login')">Sign In</button>
    </div>

    <!-- Google One-Click OAuth Button -->
    <div class="social-auth">
      <button type="button" class="btn-google" onclick="handleGoogleAuth()">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>
    </div>

    <div class="divider">or with email</div>

    <div class="error-msg" id="error-box"></div>

    <!-- SIGN UP FORM -->
    <form id="form-signup">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="su-firstname" required placeholder="Jean-Luc">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="su-lastname" required placeholder="Kambale">
        </div>
      </div>

      <div class="form-group">
        <label>WhatsApp Phone Number</label>
        <input type="tel" id="su-phone" required placeholder="+234 / +254 / +243 / +...">
        <div class="help-text">Used for admissions milestone updates.</div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="su-email" required placeholder="student@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="su-password" required minlength="6" placeholder="Choose a secure password">
      </div>

      <button type="submit" class="btn-submit">
        Create Account & Begin Assessment <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <!-- LOGIN FORM -->
    <form id="form-login" class="hidden">
      <div class="form-group">
        <label>Email or WhatsApp Phone</label>
        <input type="text" id="li-identifier" required placeholder="student@example.com or +243...">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="li-password" required placeholder="Enter your password">
      </div>

      <button type="submit" class="btn-submit">
        Sign In to Portal <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>

  <script>
    const API_BASE = 'https://fluentwave-api.onrender.com/api/v1/auth';

    function switchTab(type) {
      document.getElementById('error-box').style.display = 'none';
      if (type === 'signup') {
        document.getElementById('tab-signup').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('form-signup').classList.remove('hidden');
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('google-btn-text').innerText = 'Sign up with Google';
      } else {
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-signup').classList.remove('active');
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-signup').classList.add('hidden');
        document.getElementById('google-btn-text').innerText = 'Sign in with Google';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.innerText = msg;
      box.style.display = 'block';
    }

    // Google Sign-In Mock / Production Handler
    async function handleGoogleAuth() {
      // In production, this prompts the Google Identity Services popup.
      // Here we provide instant one-click onboarding and verification:
      const dummyEmail = prompt('Enter your Google Email (or press OK to use test Google account):', 'student.google@fluentwave.org');
      if (!dummyEmail) return;

      try {
        const res = await fetch(`${API_BASE}/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: dummyEmail,
            firstName: 'Google',
            lastName: 'Student',
            googleId: 'g_' + Date.now()
          })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('fluentwave_user', JSON.stringify(data.user));
          if (data.student) {
            localStorage.setItem('fluentwave_student', JSON.stringify(data.student));
          }
          window.location.href = 'student_portal.html';
        } else {
          showError(data.error || 'Google Authentication failed.');
        }
      } catch (err) {
        showError('Could not connect to backend.');
      }
    }

    // Handle Standard Sign Up
    document.getElementById('form-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        firstName: document.getElementById('su-firstname').value,
        lastName: document.getElementById('su-lastname').value,
        phone: document.getElementById('su-phone').value,
        email: document.getElementById('su-email').value,
        password: document.getElementById('su-password').value
      };

      try {
        const res = await fetch(`${API_BASE}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('fluentwave_user', JSON.stringify(data.user));
          localStorage.setItem('fluentwave_student', JSON.stringify(data.student));
          window.location.href = 'student_portal.html';
        } else {
          showError(data.error || 'Failed to create account.');
        }
      } catch (err) {
        showError('Could not connect to backend server at http://localhost:4000.');
      }
    });

    // Handle Standard Login
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        emailOrPhone: document.getElementById('li-identifier').value,
        password: document.getElementById('li-password').value
      };

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('fluentwave_user', JSON.stringify(data.user));
          if (data.student) {
            localStorage.setItem('fluentwave_student', JSON.stringify(data.student));
          }
          window.location.href = 'student_portal.html';
        } else {
          showError(data.error || 'Invalid credentials.');
        }
      } catch (err) {
        showError('Could not connect to backend server.');
      }
    });
  </script>
</body>
</html>
